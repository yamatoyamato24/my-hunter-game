name: Build Game
on: [push]
jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install pygbag
        run: pip install pygbag
      - name: Build with pygbag
        run: pygbag --build .
      - name: Upload to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
